# SPDX-License-Identifier: Apache-2.0
# prime-claw runtime sandbox policy (deny-by-default egress). Phase 2 consolidation of phase1-sandbox.yaml.
#
# Deliberately minimal: exactly ONE benign allowed endpoint (example.com:443,
# curl only) exists solely so scripts/validate-phase1-sandbox.py can prove the
# "policy-allowed egress succeeds" half of R-U1-5. Everything else is denied
# by default. Later slices add real endpoints (model API hosts via providers
# in Slice 3, etc.) as explicit named entries here.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc/self
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  # Egress-proof canary. NOT a real dependency: exists so the validator can
  # show that declared egress works while undeclared egress is refused.
  egress_canary:
    name: egress-canary-example-com
    endpoints:
      - { host: example.com, port: 443 }
    binaries:
      - path: /usr/bin/curl

  # Slice 2: prime-agent install channel. The documented installer resolves a
  # versioned tarball from Prime Intellect's R2 release bucket (README: "Do
  # not use the inherited npm package as the Prime Agent install path").
  # Two legs, bound to the binary that actually holds the sockets:
  #   1. /usr/bin/curl fetches install.sh (app.primeintellect.ai) and the
  #      release tarball + SHA256SUMS (R2 bucket).
  #   2. The release package has npm runtime dependencies, so the installer's
  #      `npm install -g` leg (node binary) needs registry.npmjs.org.
  prime_agent_release:
    name: prime-agent-release-channel
    endpoints:
      - { host: app.primeintellect.ai, port: 443 }
      - { host: pub-728493de92a943e2a9b2d17b4719f318.r2.dev, port: 443 }
    binaries:
      - path: /usr/bin/curl
  # Slice 3: credentialed model endpoints (R-U1-6). These are the hosts the
  # attached OpenShell providers inject real credentials for at L7. Declared as
  # inspected `protocol: rest` endpoints (required: provider-credentialed
  # endpoints reject L4/tls-skip modes) so the proxy can rewrite the placeholder
  # env values (openshell:..._api_key etc.) into real auth on the wire. The
  # sandbox process only ever holds placeholders; real keys never touch disk.
  # Binaries: curl (the validator's direct probe) + node (prime-agent runtime).
  # Slice 3 (corrected, D12/D13/D14): the host instance is gateway-fronted.
  # ALL inference goes to the shared AI Gateway ai-gateway.zende.sk
  # (/anthropic, /v1, /bedrock), not provider-native hosts. This is the ONLY
  # credentialed egress. The sandbox process only ever holds the opaque
  # placeholder; the real gateway key is substituted at L7 behind this
  # inspected rest endpoint. Binaries: curl (validator probe) + node
  # (prime-agent runtime).
  # PRIME_CLAW_GATEWAY_POLICY_BEGIN
  model_ai_gateway:
    name: model-ai-gateway-credentialed
    endpoints:
      - { host: ai-gateway.zende.sk, port: 443, protocol: rest, access: read-write }
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/node
      # Historical Slice 2 access. The Slice 4A local-policy renderer removes
      # these two lines before adding the exact home endpoint. Keeping them in
      # the tracked base until cutover prevents an ordinary pre-cutover
      # `converge` from breaking the still-canonical 1536-dimension index.
      - path: /usr/local/bin/bun
      - path: /usr/local/bin/gbrain
  # PRIME_CLAW_GATEWAY_POLICY_END

  # Slice 4A (D3a-L): rendered at preflight into an ignored operator-local
  # policy. The private host/port never enters this tracked template. The rule
  # grants only gbrain/Bun access; it is unauthenticated and separate from the
  # corporate model gateway above.
  # PRIME_CLAW_HOME_EMBEDDING_POLICY

  # Explicit openai-codex overrides use host-side OpenShell OAuth. The sandbox
  # auth projection contains only a synthetic JWT and opaque placeholders.
  # PRIME_CLAW_CODEX_POLICY_BEGIN
  model_openai_codex:
    name: model-openai-codex-oauth
    endpoints:
      - { host: api.openai.com, port: 443, protocol: rest, access: read-write }
      - { host: auth.openai.com, port: 443, protocol: rest, access: read-write }
      - { host: chatgpt.com, port: 443, protocol: rest, access: read-write }
      - { host: ab.chatgpt.com, port: 443, protocol: rest, access: read-write }
    binaries:
      - path: /usr/bin/node
  # PRIME_CLAW_CODEX_POLICY_END

  # Slice 1 (R3a-1/7): credentialed github.com for git clone/fetch/push of the brain
  # repo. The attached github-push provider injects the real token at L7; the sandbox
  # only ever holds a placeholder. Declared as its own inspected `rest` rule keyed to
  # /usr/bin/git (separate from kernel_bootstrap's L4 github access, which serves curl/
  # uv and must stay unauthenticated to avoid a mixed-mode policy violation). Push needs
  # git-receive-pack, which the builtin github profile forbids; the custom github-push
  # profile allows it.
  github_brain:
    name: github-brain-push
    endpoints:
      - { host: github.com, port: 443, protocol: rest, access: read-write }
      - { host: api.github.com, port: 443, protocol: rest, access: read-write }
    # git carries the placeholder token (L7 swaps to the real credential). uv + curl are here
    # ONLY so the kernel-bootstrap python download (github.com/.../releases/...) is reachable:
    # they never send the placeholder, so the L7 swap never fires for them and they traverse
    # unauthenticated. OpenShell requires credentialed-endpoint hosts be L7 in every rule, so
    # github.com cannot also appear as L4 in kernel_bootstrap.
    binaries:
      - path: /usr/bin/git
      - path: /usr/local/bin/uv
      - path: /usr/bin/curl

  # Slice 2 kernel bootstrap: prime-agent's persistent Python REPL needs uv +
  # a managed Python 3.11. uv installer: astral.sh (script) then GitHub
  # releases (binary). uv then pulls python-build-standalone from GitHub and
  # packages from pypi/files.pythonhosted.org. uv lands at
  # /sandbox/.local/bin/uv — bind that path (and curl for the installer).
  kernel_bootstrap:
    name: kernel-bootstrap-uv-python
    # github.com + api.github.com are here as L4 for the uv python-build-standalone
    # download (uv fetches https://github.com/astral-sh/python-build-standalone/releases/...).
    # They are keyed to curl/uv (download tooling), which NEVER carries the github credential:
    # the credentialed github access for git clone/push is the SEPARATE github_brain rule keyed
    # to /usr/bin/git only. OpenShell keys credential injection per-binary, so uv/curl on
    # github.com stay unauthenticated while git gets the L7 token swap.
    endpoints:
      - { host: astral.sh, port: 443 }
      - { host: objects.githubusercontent.com, port: 443 }
      - { host: release-assets.githubusercontent.com, port: 443 }
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
    binaries:
      - path: /usr/bin/curl
      - path: /usr/local/bin/uv

  prime_agent_npm_deps:
    name: prime-agent-npm-runtime-deps
    # registry.npmjs.org: npm runtime deps of the release package.
    # R2 bucket: the release tarball references bundled component tarballs
    # (prime-agent-core/-ai) by URL; npm (node) fetches those directly.
    endpoints:
      - { host: registry.npmjs.org, port: 443 }
      - { host: pub-728493de92a943e2a9b2d17b4719f318.r2.dev, port: 443 }
    binaries:
      - path: /usr/bin/node

