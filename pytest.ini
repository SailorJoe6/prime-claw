[pytest]
# Truthful test tiers (see DEVELOPERS.md "Testing"):
#   unmarked   = tier 0: host-safe unit/static tests; plain pytest default
#   container  = tier 1: real execution inside the disposable tier-1 container
#   integration = reserved guard for the non-pytest tier-2 Docker body
#   lifecycle  = explicit host observer; marker+fixture+--run-lifecycle required
#                  (Slice 6 provides no live body or adapter)
# tests/conftest.py auto-marks tier-1 fixture users. Only the exact marker
# expression `-m container` admits tier 1. Every other expression keeps all
# environment markers skipped, so arbitrary `-m` input cannot bypass guards.
markers =
    container: tier 1 — executes inside the disposable tier-1 Docker container
    integration: reserved tier-2 guard — use scripts/test-integration.sh, never host pytest
    lifecycle: explicit host observer — requires lifecycle_scope and --run-lifecycle
    macos_host: reserved host observer registry — empty and always skipped in Slice 6
    sandbox: deprecated disabled alias for lifecycle (never host-executed)
