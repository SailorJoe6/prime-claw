[pytest]
# Test tiers (see DEVELOPERS.md "Testing"):
#   unmarked  = tier 0 (host, no environment: no Node, no prime-agent, no Docker)
#   container = tier 1 (runs inside the tier-1 test container; requires Docker)
#   integration = tier 2 (explicit disposable PostgreSQL/gbrain container)
#   sandbox     = legacy host-orchestrated OpenShell tests pending Slice 4 taxonomy
# tests/conftest.py auto-marks any test that requests the tier1_container or
# ctmp fixtures as `container`, and SKIPS container/integration/sandbox tests
# unless an explicit -m mark expression selects them — so plain pytest is
# always the tier-0 default with no Docker dependency.
markers =
    container: tier 1 — runs inside the tier-1 test container (requires Docker; run with -m container or scripts/test-all.sh)
    integration: tier 2 — explicit disposable PostgreSQL/gbrain container body (run through scripts/test-integration.sh)
    sandbox: legacy host-orchestrated OpenShell sandbox tests pending Slice 4 taxonomy
