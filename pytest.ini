[pytest]
# Test tiers (see DEVELOPERS.md "Testing"):
#   unmarked  = tier 0 (host, no environment: no Node, no prime-agent, no Docker)
#   container = tier 1 (runs inside the tier-1 test container; requires Docker)
#   sandbox   = tier 2 (host-orchestrated OpenShell sandbox tests)
# tests/conftest.py auto-marks any test that requests the tier1_container or
# ctmp fixtures as `container`, and SKIPS container/sandbox tests unless an
# explicit -m mark expression selects them — so plain `pytest tests/ -q` is
# always the tier-0 default with no Docker dependency.
markers =
    container: tier 1 — runs inside the tier-1 test container (requires Docker; run with -m container or scripts/test-all.sh)
    sandbox: tier 2 — host-orchestrated OpenShell sandbox tests (run with -m sandbox or scripts/test-all.sh --with-sandbox)
