[project]
name = "prime-claw-official-expert-review"
version = "0.1.0"
description = "Prime Claw official EXPERT review definition and deterministic availability preflight"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_claw_official_expert_review"]

[tool.hatch.build.targets.wheel.force-include]
"src/prime_claw_official_expert_review/reviewer.md" = "prime_claw_official_expert_review/reviewer.md"
